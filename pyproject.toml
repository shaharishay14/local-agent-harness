[project]
name = "local-agent"
version = "0.0.1"
description = "A personal agent that runs on your own machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shahar Ishay" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25",
    "openai-agents>=0.24.0",
    "pyyaml>=6",
]

[project.scripts]
local-agent = "local_agent.cli:main"

[project.optional-dependencies]
anthropic = [
    "openai-agents[litellm]>=0.24.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "openai-agents[litellm]>=0.24.0",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.format]
quote-style = "single"
