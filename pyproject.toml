[project]
name = "local-agent"
version = "0.0.1"
description = "A personal agent that runs on your own machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shahar Ishay" }]
requires-python = ">=3.12"
dependencies = [
    "croniter>=6",
    "httpx>=0.28.1",
    "keyring>=25",
    "openai-agents[litellm]>=0.24.0",
    "openpyxl>=3.1",
    "pypdf>=5",
    "pyyaml>=6",
    "tiktoken>=0.14",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
local-agent = "local_agent.cli:main"

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
# scripts/release.sh builds the web UI into this gitignored folder; without it the daemon shows a placeholder page
artifacts = ["src/local_agent/ui/"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.1",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.format]
quote-style = "single"
